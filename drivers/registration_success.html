<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registration Successful</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: linear-gradient(135deg, #eef7ff, #ffffff);
        }

        .card {
            width: 100%;
            max-width: 480px;
            background: #ffffff;
            border-radius: 22px;
            padding: 45px 35px;
            text-align: center;
            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.12);
        }

        .success-icon {
            width: 85px;
            height: 85px;
            margin: 0 auto 25px;
            border-radius: 50%;
            background: #e8f8ee;
            color: #18a957;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 45px;
            font-weight: bold;
        }

        h1 {
            color: #222;
            font-size: 28px;
            margin-bottom: 12px;
        }

        .subtitle {
            color: #666;
            line-height: 1.6;
            font-size: 15px;
            margin-bottom: 28px;
        }

        .info {
            background: #f7f9fc;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 25px;
            color: #555;
            font-size: 14px;
        }

        .info strong {
            color: #222;
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: #d71920;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        button:hover {
            background: #b90f16;
        }

        .back {
            display: block;
            margin-top: 18px;
            color: #777;
            text-decoration: none;
            font-size: 14px;
        }

        .back:hover {
            color: #d71920;
        }
    </style>
</head>

<body>

<div class="card">

    <div class="success-icon">
        ✓
    </div>

    <h1>Registration Successful!</h1>

    <p class="subtitle">
        Your ambulance driver account has been created successfully.
    </p>

    <div class="info">
        <strong>Next Step</strong><br><br>
        Verify your mobile number using the OTP
        sent to your registered phone number.
    </div>

    <button onclick="continueToOTP()">
        Continue to OTP Verification →
    </button>

    <a href="index.html" class="back">
        ← Back to Driver Home
    </a>

</div>


<script>

function continueToOTP() {

    window.location.href = "verify_otp.html";

}

</script>

</body>
</html>
